services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
      - pnpm_store:/app/.pnpm-store
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX:-localhost}
      - WATCHPACK_POLLING=true
    command: ["sh", "-ec", "corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --no-frozen-lockfile && exec pnpm --filter @3bm/web exec next dev --turbo --hostname 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:
  pnpm_store:
